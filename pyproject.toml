[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="pynovel-engine"
version="0.4.0"
description="Cross-platform Python visual novel engine and editor"
requires-python=">=3.10"
dependencies=["pygame-ce>=2.5","PySide6>=6.7"]
[project.scripts]
pynovel="vnengine.cli:main"
pynovel-editor="editor.main:main"
[tool.pytest.ini_options]
pythonpath=["."]
[tool.setuptools.packages.find]
include=["vnengine*","editor*"]
